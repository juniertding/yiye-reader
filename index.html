  <style>

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid rgba(244,184,96,.45);outline-offset:2px}.hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.rail{position:sticky;top:0;height:100vh;padding:28px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#141513}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#171816;display:grid;place-items:center;font-family:serif;font-size:22px}.nav{display:grid;gap:8px;margin-top:42px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 14px;border-radius:10px;text-align:left;font-weight:650}.nav button.active,.nav button:hover{color:var(--text);background:var(--panel)}.privacy{margin-top:auto;font-size:13px;line-height:1.65;color:var(--muted);padding:14px;border:1px solid var(--line);border-radius:12px}.main{padding:46px clamp(24px,5vw,72px) 80px;max-width:1400px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.14em;font-weight:800}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,62px);line-height:1.04;margin:8px 0 12px;font-weight:500}.sub{color:var(--muted);margin:0;font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:#5b5e55}.btn.primary{background:var(--accent);border-color:var(--accent);color:#171816}.btn.icon{width:42px;height:42px;padding:0;display:grid;place-items:center}.section-head{display:flex;align-items:end;justify-content:space-between;margin:46px 0 18px}.section-head h2{font-family:Georgia,"Songti SC",serif;font-size:22px;font-weight:500;margin:0}.section-head span{font-size:13px;color:var(--muted)}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.book{min-height:285px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:.2s}.book:hover{transform:translateY(-3px);border-color:#5b5e55}.book:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}.book .num{font-family:Georgia,serif;color:var(--accent);font-size:40px;opacity:.78}.book h3{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:23px;margin:auto 0 10px;line-height:1.3}.book p{color:var(--muted);margin:0 0 16px;font-size:13px}.progress{height:3px;background:#3a3c36;border-radius:8px;overflow:hidden}.progress i{display:block;background:var(--accent);height:100%}.book-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}.package{min-height:175px}.package h3{margin:22px 0 8px}.empty{border:1px dashed #4a4c45;border-radius:18px;padding:62px 24px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{color:var(--text);display:block;font-family:Georgia,"Songti SC",serif;font-size:24px;font-weight:500;margin-bottom:8px}.toast{position:fixed;z-index:50;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f5f1e8;color:#171816;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:700;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);box-shadow:var(--shadow);padding:0;width:min(92vw,600px)}dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-family:Georgia,"Songti SC",serif;font-weight:500;margin:0}.import-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.import-card{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:20px;text-align:left;min-height:116px}.import-card:hover{border-color:var(--accent)}.import-card b{display:block;font-size:16px;margin-bottom:7px}.import-card small{color:var(--muted);line-height:1.5}.urlbox{display:flex;gap:8px;margin-top:12px}.urlbox input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;background:#171816;color:var(--text);padding:11px}.zip-list{max-height:52vh;overflow:auto;display:grid;gap:7px}.zip-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:12px;border-radius:10px;text-align:left}.zip-item input{width:20px;height:20px;accent-color:var(--accent)}.zip-item small{color:var(--muted);margin-left:auto}.zip-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.note{font-size:13px;color:var(--muted);line-height:1.6}.camera{width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;object-fit:cover}
    .reader{position:fixed;inset:0;z-index:20;background:var(--paper,#eee9dd);color:var(--ink,#272622);display:grid;grid-template-rows:auto 1fr auto}.reader.day{--paper:#f1eee6;--ink:#282722;--soft:#6f6b62;--rline:#d6d0c4}.reader.eye{--paper:#dfe8d4;--ink:#273026;--soft:#667062;--rline:#bdcbb2}.reader.night{--paper:#171816;--ink:#e4e0d7;--soft:#929087;--rline:#353731}.rbar{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rline);background:color-mix(in srgb,var(--paper) 93%,transparent)}.rbar .bookname{font-family:Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}.rtools{display:flex;gap:7px}.rbtn{border:0;background:transparent;color:var(--ink);border-radius:9px;padding:9px 11px;font-weight:700}.rbtn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}.reading{overflow-y:auto;scroll-behavior:smooth}.prose{max-width:var(--measure,760px);margin:0 auto;padding:56px var(--gutter,32px) 120px;font-family:Georgia,"Songti SC","STSong",serif;font-size:var(--fontSize,20px);line-height:var(--lineHeight,1.9)}.prose h2{font-size:1.45em;font-weight:600;line-height:1.35;margin:1.6em 0 .9em}.prose h2:first-child{margin-top:0}.prose p{margin:0 0 var(--paraGap,.85em);text-indent:2em;white-space:pre-wrap}.prose.raw p{text-indent:0;white-space:pre-wrap}.rfoot{height:48px;border-top:1px solid var(--rline);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--soft);font-size:12px}.drawer{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(88vw,370px);background:var(--paper);color:var(--ink);box-shadow:12px 0 44px rgba(0,0,0,.25);transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{height:66px;border-bottom:1px solid var(--rline);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.tabs{display:flex;padding:12px 18px 0;gap:8px}.tabs button{flex:1;border:1px solid var(--rline);color:var(--ink);background:transparent;border-radius:9px;padding:8px}.tabs button.active{background:var(--ink);color:var(--paper)}.drawer-list{overflow:auto;padding:12px 18px 28px}.chapter{width:100%;border:0;border-bottom:1px solid var(--rline);background:transparent;color:var(--ink);padding:13px 2px;text-align:left}.bookmark{padding:12px 2px;border-bottom:1px solid var(--rline);display:grid;gap:6px}.bookmark button{justify-self:start}.settings{position:fixed;z-index:31;left:50%;bottom:18px;transform:translate(-50%,130%);transition:.25s;background:var(--paper);color:var(--ink);border:1px solid var(--rline);border-radius:18px;box-shadow:var(--shadow);width:min(94vw,650px);padding:18px}.settings.open{transform:translate(-50%,0)}.setting-row{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;padding:10px 0}.setting-row label{font-size:13px;color:var(--soft)}.setting-row input{width:100%;accent-color:var(--ink)}.themes{display:flex;gap:8px}.themes button{border:1px solid var(--rline);border-radius:9px;padding:8px 12px;background:transparent;color:var(--ink)}.themes button.active{background:var(--ink);color:var(--paper)}.overlay{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.2);display:none}.overlay.open{display:block}
    @media(max-width:760px){.app{grid-template-columns:1fr}.rail{height:auto;position:static;border:0;border-bottom:1px solid var(--line);padding:16px 20px;flex-direction:row;align-items:center}.nav{margin:0 0 0 auto;display:flex}.nav button{padding:9px}.privacy{display:none}.main{padding:28px 18px 60px}.topline{display:block}.actions{justify-content:flex-start;margin-top:24px}.title{font-size:42px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.book{min-height:220px;padding:17px}.book h3{font-size:19px}.import-grid{grid-template-columns:1fr}.rbar{padding:0 10px}.rbar .bookname{max-width:38vw}.rtools{gap:0}.rbtn{padding:9px}.prose{padding-top:38px}.setting-row{grid-template-columns:70px 1fr auto}}@media(max-width:430px){.books{grid-template-columns:1fr}.book{min-height:190px}.brand span:last-child{display:none}}
  </style>
</head>
<body>
  <div class="app" id="shelfView">
    <aside class="rail"><div class="brand"><span class="mark">页</span><span>一页</span></div><nav class="nav"><button class="active" data-filter="all">我的书架</button><button data-filter="recent">最近阅读</button></nav><div class="privacy">所有书籍、进度与书签只保存在这台设备上。</div></aside>
    <main class="main"><div class="topline"><div><div class="eyebrow">PRIVATE READER</div><h1 class="title">我的书架</h1><p class="sub" id="shelfMeta">安静地读，只属于你。</p></div><div class="actions"><button class="btn" id="scanBtn">▦ 扫二维码</button><button class="btn primary" id="importBtn">＋ 导入小说</button></div></div><div class="section-head"><h2 id="sectionTitle">收藏的书</h2><span id="count"></span></div><div class="books" id="books"></div><div class="section-head"><h2>小说包</h2><button class="btn" id="packageBtn">＋ 添加 RAR / ZIP</button></div><p class="note">扫描分享页后，请先在网页中下载小说包，再回到这里添加。小说包保存在本机，可重复打开。</p><div class="books" id="packages"></div></main>
  </div>
  <section class="reader day hidden" id="reader"><header class="rbar"><button class="rbtn" id="backBtn">返回</button><div class="bookname" id="readerTitle"></div><div class="rtools"><button class="rbtn" id="bookmarkBtn" title="添加书签">书签</button><button class="rbtn" id="menuBtn">目录</button><button class="rbtn" id="settingsBtn">Aa</button></div></header><div class="reading" id="reading"><article class="prose" id="prose"></article></div><footer class="rfoot"><span id="chapterLabel">正文</span><span id="progressLabel">0%</span></footer></section>
  <div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="drawer-head"><b id="drawerTitle">目录</b><button class="rbtn" id="closeDrawer">关闭</button></div><div class="tabs"><button class="active" data-tab="toc">目录</button><button data-tab="marks">书签</button></div><div class="drawer-list" id="drawerList"></div></aside>
  <section class="settings" id="settings"><div class="setting-row"><label>主题</label><div class="themes"><button data-theme="day">日间</button><button data-theme="eye">护眼</button><button data-theme="night">夜间</button></div><span></span></div><div class="setting-row"><label>字号</label><input id="fontSize" type="range" min="16" max="32"><output id="fontOut"></output></div><div class="setting-row"><label>行距</label><input id="lineHeight" type="range" min="15" max="25"><output id="lineOut"></output></div><div class="setting-row"><label>边距</label><input id="gutter" type="range" min="16" max="72"><output id="gutterOut"></output></div><div class="setting-row"><label>排版</label><button class="btn" id="formatToggle">阅读排版</button><span></span></div></section>
  <dialog id="importDialog"><div class="modal"><div class="modal-head"><h2>导入小说</h2><button class="btn icon" data-close="importDialog">×</button></div><div class="import-grid"><button class="import-card" id="pickTxt"><b>TXT 文本</b><small>自动识别 UTF-8、GBK、GB18030 等常见中文编码</small></button><button class="import-card" id="pickZip"><b>ZIP 压缩包</b><small>浏览压缩包中的文件夹，选择要加入书架的 TXT</small></button></div><p class="note">也可以粘贴 TXT 或 ZIP 的直接下载地址。</p><div class="urlbox"><input id="urlInput" type="url" placeholder="https://example.com/book.txt"><button class="btn primary" id="downloadBtn">下载</button></div></div></dialog>
  <dialog id="zipDialog"><div class="modal"><div class="modal-head"><h2 id="zipTitle">小说包内容</h2><button class="btn icon" data-close="zipDialog">×</button></div><div class="zip-list" id="zipList"></div><div class="zip-actions"><span class="note" id="zipHint">勾选需要加入书架的 TXT</span><button class="btn primary" id="importSelected">导入所选</button></div></div></dialog>
  <dialog id="scanDialog"><div class="modal"><div class="modal-head"><h2>扫描下载二维码</h2><button class="btn icon" id="closeScan">×</button></div><video class="camera hidden" id="camera" playsinline></video><p class="note" id="scanNote">可使用摄像头扫描，也可以选择一张二维码图片。</p><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="startCamera">打开摄像头</button><button class="btn" id="pickQr">选择二维码图片</button></div></div></dialog>
  <input hidden type="file" id="fileInput" accept=".txt,.zip,.rar,text/plain,application/zip,application/vnd.rar"><input hidden type="file" id="qrInput" accept="image/*"><input hidden type="file" id="packageInput" accept=".zip,.rar,application/zip,application/vnd.rar"><div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
  (()=>{'use strict';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const DB='yiye-reader', STORE='books', PACKAGES='packages'; let db, books=[], packages=[], current=null, zipEntries=[], activePackage=null, stream=null, activeTab='toc';
    const prefs=Object.assign({theme:'day',fontSize:20,lineHeight:19,gutter:32,formatted:true},JSON.parse(localStorage.getItem('yiye-prefs')||'{}'));
    const el={books:$('#books'),count:$('#count'),reader:$('#reader'),reading:$('#reading'),prose:$('#prose'),drawer:$('#drawer'),drawerList:$('#drawerList'),settings:$('#settings'),overlay:$('#overlay')};
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400)}
    function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'});if(!q.result.objectStoreNames.contains(PACKAGES))q.result.createObjectStore(PACKAGES,{keyPath:'id'})};q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}
    function tx(name=STORE,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
    function getAll(name){return new Promise((res,rej)=>{const q=tx(name).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
    function allBooks(){return getAll(STORE)}function allPackages(){return getAll(PACKAGES)}
    function put(name,value){return new Promise((res,rej)=>{const q=tx(name,'readwrite').put(value);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
    function remove(name,key){return new Promise((res,rej)=>{const q=tx(name,'readwrite').delete(key);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
    function saveBook(b){return put(STORE,b)}
    function deleteBook(id){return remove(STORE,id)}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
    function decode(bytes){for(const enc of ['utf-8','gb18030','gbk','big5']){try{const s=new TextDecoder(enc,{fatal:true}).decode(bytes);if(!s.includes('\uFFFD'))return s.replace(/^\uFEFF/,'')}catch{}}return new TextDecoder('utf-8').decode(bytes)}
    function chapters(text){const out=[];const re=/^(?:\s{0,6})(第[零〇一二三四五六七八九十百千万两\d]+[章节卷回部篇]|Chapter\s+\d+|CHAPTER\s+\d+)[^\n]{0,40}$/gmi;let m;while((m=re.exec(text))&&out.length<2000)out.push({title:m[0].trim(),offset:m.index});return out.length?out:[{title:'正文',offset:0}]}
    function formatText(text){const parts=[];const re=/^(?:\s{0,6})(第[零〇一二三四五六七八九十百千万两\d]+[章节卷回部篇]|Chapter\s+\d+|CHAPTER\s+\d+)[^\n]{0,40}$/i;for(const raw of text.replace(/\r/g,'').split(/\n+/)){const line=raw.trim();if(!line)continue;parts.push(re.test(line)?`<h2>${esc(line)}</h2>`:`<p>${esc(line)}</p>`)}return parts.join('')||'<p>这本书没有可显示的文字。</p>'}
    function renderShelf(filter='all'){const list=[...books].sort((a,b)=>(b.lastRead||b.added)-(a.lastRead||a.added));const shown=filter==='recent'?list.filter(x=>x.lastRead).slice(0,12):list;$('#sectionTitle').textContent=filter==='recent'?'最近打开':'收藏的书';el.count.textContent=shown.length?`${shown.length} 本`:'';$('#shelfMeta').textContent=books.length?`这里有 ${books.length} 本书，阅读进度会自动保存。`:'安静地读，只属于你。';el.books.innerHTML=shown.length?shown.map((b,i)=>`<article class="book" tabindex="0" data-id="${b.id}"><div class="num">${String(i+1).padStart(2,'0')}</div><h3>${esc(b.title)}</h3><p>${b.chapters?.length||1} 章 · ${b.source||'本地导入'}</p><div class="progress"><i style="width:${Math.round((b.progress||0)*100)}%"></i></div><div class="book-foot"><span>${Math.round((b.progress||0)*100)}%</span><button class="rbtn delete" data-id="${b.id}">移除</button></div></article>`).join(''):`<div class="empty"><strong>书架还是空的</strong>导入 TXT 或 ZIP，开始你的第一本书。</div>`;renderPackages()}
    function renderPackages(){const host=$('#packages');if(!host)return;host.innerHTML=packages.length?packages.slice().sort((a,b)=>b.added-a.added).map(p=>`<article class="book package" tabindex="0" data-package="${p.id}"><div class="num">包</div><h3>${esc(p.name)}</h3><p>${(p.bytes.byteLength/1048576).toFixed(1)} MB · 点击浏览</p><div class="book-foot"><span>${new Date(p.added).toLocaleDateString()}</span><button class="rbtn package-delete" data-id="${p.id}">移除</button></div></article>`).join(''):`<div class="empty"><strong>还没有小说包</strong>下载 RAR 或 ZIP 后添加，可随时重新打开。</div>`}
    async function addText(name,bytes,source='本地导入'){const text=decode(bytes);if(!text.trim())throw new Error('没有读到文字内容');const title=name.replace(/\.[^.]+$/,'');const b={id:id(),title,text,source,chapters:chapters(text),progress:0,scroll:0,marks:[],added:Date.now(),lastRead:0};await saveBook(b);books.push(b);renderShelf();toast(`《${title}》已加入书架`)}
    async function handleFile(file){if(!file)return;const bytes=new Uint8Array(await file.arrayBuffer());if(/\.(zip|rar)$/i.test(file.name)||file.type.includes('zip')||file.type.includes('rar')){const p={id:id(),name:file.name,type:/\.rar$/i.test(file.name)?'rar':'zip',bytes:bytes.buffer,added:Date.now()};await put(PACKAGES,p);packages.push(p);renderPackages();await openPackage(p)}else await addText(file.name,bytes)}
    function u16(b,o){return b[o]|b[o+1]<<8}function u32(b,o){return (b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0}
    async function inflate(raw){if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持解压');const ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}
    function parseZip(bytes){let eocd=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(u32(bytes,i)===0x06054b50){eocd=i;break}if(eocd<0)throw new Error('无法识别这个 ZIP');let count=u16(bytes,eocd+10),off=u32(bytes,eocd+16),arr=[];for(let n=0;n<count&&u32(bytes,off)===0x02014b50;n++){const flags=u16(bytes,off+8),method=u16(bytes,off+10),csize=u32(bytes,off+20),usize=u32(bytes,off+24),nl=u16(bytes,off+28),xl=u16(bytes,off+30),cl=u16(bytes,off+32),lo=u32(bytes,off+42),nameBytes=bytes.slice(off+46,off+46+nl);let name;try{name=new TextDecoder(flags&0x800?'utf-8':'gb18030').decode(nameBytes)}catch{name=new TextDecoder().decode(nameBytes)}if(!name.endsWith('/'))arr.push({name,method,csize,usize,lo,bytes});off+=46+nl+xl+cl}return arr}
    async function extract(e){const nl=u16(e.bytes,e.lo+26),xl=u16(e.bytes,e.lo+28),start=e.lo+30+nl+xl,raw=e.bytes.slice(start,start+e.csize);if(e.method===0)return raw;if(e.method===8)return inflate(raw);throw new Error('暂不支持这个 ZIP 的压缩方式')}
    async function openPackage(p){activePackage=p;$('#zipTitle').textContent=p.name;$('#zipList').innerHTML='<p class="note">正在读取小说包…</p>';$('#zipDialog').showModal();try{if(p.type==='rar'){const mod=await import('https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/+esm');const wasm=await(await fetch('https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/js/unrar.wasm')).arrayBuffer();const ex=await mod.createExtractorFromData({data:p.bytes.slice(0),wasmBinary:wasm});zipEntries=[...ex.getFileList().fileHeaders].filter(h=>!h.flags.directory&&/\.txt$/i.test(h.name)).map(h=>({name:h.name,usize:h.unpSize,rar:true,extractor:ex}))}else zipEntries=parseZip(new Uint8Array(p.bytes)).filter(e=>/\.txt$/i.test(e.name));$('#zipList').innerHTML=zipEntries.length?zipEntries.map((e,i)=>`<label class="zip-item"><input type="checkbox" value="${i}"><span>${esc(e.name)}</span><small>${((e.usize||0)/1048576).toFixed(1)} MB</small></label>`).join(''):'<div class="empty"><strong>没有找到 TXT</strong>这个小说包里没有 TXT 文件。</div>'}catch(e){$('#zipList').innerHTML=`<div class="empty"><strong>无法打开小说包</strong>${esc(e.message||'文件可能不完整或需要密码')}</div>`}}
    async function openZip(name,bytes){const p={id:id(),name,type:'zip',bytes:bytes.buffer,added:Date.now()};await put(PACKAGES,p);packages.push(p);renderPackages();await openPackage(p)}
    async function openBook(book,restore=true){current=book;book.lastRead=Date.now();await saveBook(book);$('#shelfView').classList.add('hidden');el.reader.classList.remove('hidden');$('#readerTitle').textContent=book.title;applyPrefs();renderBook();requestAnimationFrame(()=>{el.reading.scrollTop=restore?(book.scroll||0):0;updateProgress()})}
    function renderBook(){el.prose.classList.toggle('raw',!prefs.formatted);el.prose.innerHTML=prefs.formatted?formatText(current.text):`<p>${esc(current.text)}</p>`;renderDrawer()}
    function applyPrefs(){el.reader.classList.remove('day','eye','night');el.reader.classList.add(prefs.theme);el.prose.style.setProperty('--fontSize',prefs.fontSize+'px');el.prose.style.setProperty('--lineHeight',(prefs.lineHeight/10));el.prose.style.setProperty('--gutter',prefs.gutter+'px');$('#fontSize').value=prefs.fontSize;$('#lineHeight').value=prefs.lineHeight;$('#gutter').value=prefs.gutter;$('#fontOut').textContent=prefs.fontSize+' px';$('#lineOut').textContent=(prefs.lineHeight/10).toFixed(1);$('#gutterOut').textContent=prefs.gutter+' px';$('#formatToggle').textContent=prefs.formatted?'阅读排版':'原始排版';$$('[data-theme]').forEach(x=>x.classList.toggle('active',x.dataset.theme===prefs.theme));localStorage.setItem('yiye-prefs',JSON.stringify(prefs))}
    function updateProgress(){if(!current)return;const max=el.reading.scrollHeight-el.reading.clientHeight;current.scroll=el.reading.scrollTop;current.progress=max>0?Math.min(1,current.scroll/max):0;$('#progressLabel').textContent=Math.round(current.progress*100)+'%';let ch=[...current.chapters].reverse().find(c=>c.offset/current.text.length<=current.progress)||current.chapters[0];$('#chapterLabel').textContent=ch.title;clearTimeout(updateProgress.t);updateProgress.t=setTimeout(()=>saveBook(current),500)}
    function renderDrawer(){if(!current)return;if(activeTab==='toc')el.drawerList.innerHTML=current.chapters.map((c,i)=>`<button class="chapter" data-chapter="${i}">${esc(c.title)}</button>`).join('');else el.drawerList.innerHTML=current.marks.length?current.marks.map((m,i)=>`<div class="bookmark"><b>${esc(m.chapter)}</b><span>${Math.round(m.progress*100)}% · ${new Date(m.time).toLocaleDateString()}</span><button class="btn" data-mark="${i}">跳转</button></div>`).join(''):'<p class="note">还没有书签。阅读时点一下“书签”即可保存当前位置。</p>'}
    function closePanels(){el.drawer.classList.remove('open');el.settings.classList.remove('open');el.overlay.classList.remove('open')}
    function showShelf(){current=null;closePanels();el.reader.classList.add('hidden');$('#shelfView').classList.remove('hidden');renderShelf()}
    async function download(url){if(!/^https?:\/\//i.test(url))throw new Error('请输入完整的网址');if(!/\.(txt|zip|rar)(?:[?#]|$)/i.test(url)){window.open(url,'_blank','noopener');toast('已打开分享页。下载完成后回到“小说包”添加文件');return}try{toast('正在下载…');const r=await fetch(url);if(!r.ok)throw new Error();const name=decodeURIComponent(url.split('/').pop().split('?')[0]||'小说包.zip');await handleFile(new File([await r.blob()],name,{type:r.headers.get('content-type')||''}))}catch{window.open(url,'_blank','noopener');toast('此网址需要先打开网页下载。下载后请回到“小说包”添加文件')}}
    function readQrPixels(source,w,h){if(typeof jsQR!=='function')return null;const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=w;c.height=h;x.drawImage(source,0,0,w,h);const p=x.getImageData(0,0,w,h);return jsQR(p.data,w,h,{inversionAttempts:'attemptBoth'})}
    async function makeDetector(){try{if(!('BarcodeDetector'in window))return null;const f=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():['qr_code'];if(!f.includes('qr_code'))return null;return new BarcodeDetector({formats:['qr_code']})}catch{return null}}
    async function scanImage(file){const img=await createImageBitmap(file),det=await makeDetector();if(det){try{const codes=await det.detect(img);if(codes[0])return onCode(codes[0].rawValue)}catch{}}const code=readQrPixels(img,img.width,img.height);if(!code)throw new Error(typeof jsQR==='function'?'图片里没有识别到二维码':'二维码组件加载失败，请稍后重试');await onCode(code.data)}
    async function onCode(value){stopCamera();$('#scanDialog').close();if(/^https?:\/\//i.test(value)){$('#urlInput').value=value;$('#importDialog').showModal();toast('已识别网址。点“下载”打开分享页，下载后添加小说包')}else toast('二维码不是可打开的网址')}
    async function startCamera(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('当前浏览器无法使用摄像头，请选择二维码图片');stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#camera');v.srcObject=stream;v.classList.remove('hidden');await v.play();$('#scanNote').textContent='请将二维码放入画面中';let det=await makeDetector(),last=0;const tick=async now=>{if(!stream)return;if(now-last>180){last=now;try{if(det){const c=await det.detect(v);if(c[0])return onCode(c[0].rawValue)}}catch{det=null;$('#scanNote').textContent='正在使用兼容识别方式扫描…'}if(!det&&v.videoWidth&&typeof jsQR==='function'){try{const max=720,scale=Math.min(1,max/v.videoWidth),code=readQrPixels(v,Math.round(v.videoWidth*scale),Math.round(v.videoHeight*scale));if(code)return onCode(code.data)}catch{}}}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
    function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camera').classList.add('hidden')}
    $('#importBtn').onclick=()=>$('#importDialog').showModal();$('#scanBtn').onclick=()=>{$('#scanDialog').showModal();startCamera().catch(x=>{$('#scanNote').textContent=x.message+'；也可以点“选择二维码图片”';$('#pickQr').focus()})};$('#packageBtn').onclick=()=>$('#packageInput').click();$('#packageInput').onchange=e=>handleFile(e.target.files[0]).catch(x=>toast(x.message)).finally(()=>e.target.value='');$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#pickTxt').onclick=()=>{$('#importDialog').close();$('#fileInput').accept='.txt,text/plain';$('#fileInput').click()};$('#pickZip').onclick=()=>{$('#importDialog').close();$('#fileInput').accept='.zip,.rar,application/zip,application/vnd.rar';$('#fileInput').click()};$('#fileInput').onchange=e=>handleFile(e.target.files[0]).catch(x=>toast(x.message)).finally(()=>e.target.value='');
    $('#downloadBtn').onclick=()=>download($('#urlInput').value.trim()).then(()=>{if($('#importDialog').open)$('#importDialog').close()}).catch(x=>toast(x.message));$('#zipList').onclick=async e=>{const b=e.target.closest('[data-zip]');if(b&&b.tagName==='BUTTON'){const z=zipEntries[+b.dataset.zip];try{const bytes=z.rar?[...z.extractor.extract({files:[z.name]}).files][0]?.extraction:await extract(z);if(!bytes)throw new Error('无法读取这个文件');await addText(z.name.split('/').pop(),bytes,activePackage?.type.toUpperCase()+' 小说包')}catch(x){toast(x.message)}}};
    $('#importSelected').onclick=async()=>{const indexes=[...$('#zipList').querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);if(!indexes.length)return toast('先勾选要导入的小说');const btn=$('#importSelected');btn.disabled=true;try{for(const i of indexes){const z=zipEntries[i],bytes=z.rar?[...z.extractor.extract({files:[z.name]}).files][0]?.extraction:await extract(z);if(bytes)await addText(z.name.split('/').pop(),bytes,activePackage?.type.toUpperCase()+' 小说包')}$('#zipDialog').close();toast(`已导入 ${indexes.length} 本小说`)}catch(x){toast(x.message)}finally{btn.disabled=false}};
    el.books.onclick=async e=>{const d=e.target.closest('.delete');if(d){e.stopPropagation();if(confirm('从书架移除这本书？')){await deleteBook(d.dataset.id);books=books.filter(x=>x.id!==d.dataset.id);renderShelf()}return}const b=e.target.closest('.book');if(b)openBook(books.find(x=>x.id===b.dataset.id))};el.books.onkeydown=e=>{if(e.key==='Enter'){const b=e.target.closest('.book');if(b)openBook(books.find(x=>x.id===b.dataset.id))}};
    el.packages.onclick=async e=>{const d=e.target.closest('.package-delete');if(d){e.stopPropagation();if(confirm('从小说包中移除这个文件？')){await remove(PACKAGES,d.dataset.id);packages=packages.filter(p=>p.id!==d.dataset.id);renderPackages()}return}const card=e.target.closest('[data-package]');if(card){const p=packages.find(x=>x.id===card.dataset.package);if(p)await openPackage(p)}};el.packages.onkeydown=e=>{if(e.key==='Enter'){const card=e.target.closest('[data-package]'),p=packages.find(x=>x.id===card?.dataset.package);if(p)openPackage(p)}};
    $$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderShelf(b.dataset.filter)});$('#backBtn').onclick=async()=>{if(current)await saveBook(current);showShelf()};$('#menuBtn').onclick=()=>{activeTab='toc';renderDrawer();el.drawer.classList.add('open');el.overlay.classList.add('open')};$('#settingsBtn').onclick=()=>{el.settings.classList.add('open');el.overlay.classList.add('open')};$('#closeDrawer').onclick=closePanels;el.overlay.onclick=closePanels;
    $$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTab=b.dataset.tab;renderDrawer()});el.drawerList.onclick=e=>{const c=e.target.closest('[data-chapter]'),m=e.target.closest('[data-mark]');let p;if(c)p=current.chapters[+c.dataset.chapter].offset/current.text.length;if(m)p=current.marks[+m.dataset.mark].progress;if(p!=null){const max=el.reading.scrollHeight-el.reading.clientHeight;el.reading.scrollTop=p*max;closePanels()}};
    $('#bookmarkBtn').onclick=async()=>{const p=current.progress||0,ch=[...current.chapters].reverse().find(c=>c.offset/current.text.length<=p)||current.chapters[0];if(current.marks.some(m=>Math.abs(m.progress-p)<.003))return toast('这里已经有书签');current.marks.push({progress:p,chapter:ch.title,time:Date.now()});await saveBook(current);toast('已添加书签')};el.reading.addEventListener('scroll',updateProgress,{passive:true});
    $$('.themes button').forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.theme;applyPrefs()});for(const [key,node,out,scale] of [['fontSize','#fontSize','#fontOut',1],['lineHeight','#lineHeight','#lineOut',.1],['gutter','#gutter','#gutterOut',1]]){$(node).oninput=e=>{prefs[key]=+e.target.value;applyPrefs()}}$('#formatToggle').onclick=()=>{prefs.formatted=!prefs.formatted;applyPrefs();renderBook()};
    $('#startCamera').onclick=()=>startCamera().catch(x=>toast(x.message));$('#pickQr').onclick=()=>$('#qrInput').click();$('#qrInput').onchange=e=>scanImage(e.target.files[0]).catch(x=>toast(x.message)).finally(()=>e.target.value='');$('#closeScan').onclick=()=>{stopCamera();$('#scanDialog').close()};$('#scanDialog').addEventListener('close',stopCamera);
    if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'list_reader_books',title:'查看书架',description:'列出当前设备私人阅读器中的书籍和阅读进度。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({books:books.map(b=>({id:b.id,title:b.title,progress:Math.round((b.progress||0)*100)}))})});document.modelContext.registerTool({name:'open_reader_book',title:'打开书籍',description:'按书籍 ID 打开私人阅读器书架中的一本书。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async({id})=>{const b=books.find(x=>x.id===id);if(!b)throw new Error('找不到这本书');await openBook(b);return{opened:b.title}}})}
    showShelf();
    window.addEventListener('pageshow',()=>{if(!current)showShelf()});
    openDB().then(async()=>{books=await allBooks();packages=await allPackages();showShelf();applyPrefs()}).catch(()=>{showShelf();toast('无法打开本地书架，请检查浏览器存储权限')});
  })();
